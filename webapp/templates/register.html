{% extends "base.html" %}
{% block title %}Registrieren · BotC Script-PDF{% endblock %}
{% block content %}
  <h1>Registrieren</h1>
  <p class="lead">Nach der Registrierung wird dein Konto erst freigegeben, bevor du dich anmelden kannst.</p>

  <form method="post" class="card">
    <label for="name">Name</label>
    <input id="name" name="name" type="text" value="{{ form.name }}" maxlength="100" autocomplete="name" required autofocus>

    <label for="email">E-Mail-Adresse</label>
    <input id="email" name="email" type="email" value="{{ form.email }}" maxlength="254" autocomplete="email" required>

    <label for="password">Passwort <span class="hint">(mindestens {{ min_password }} Zeichen)</span></label>
    <input id="password" name="password" type="password" minlength="{{ min_password }}" maxlength="200"
           autocomplete="new-password" required>

    <label for="password_confirm">Passwort wiederholen</label>
    <input id="password_confirm" name="password_confirm" type="password" minlength="{{ min_password }}" maxlength="200"
           autocomplete="new-password" required>

    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <button type="submit">Registrieren</button>
  </form>
  <p class="alt">Schon ein Konto? <a href="{{ url_for('login') }}">Anmelden</a></p>
{% endblock %}
